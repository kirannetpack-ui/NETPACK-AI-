<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 120" width="100%" height="100%" fill="none">
    <defs>
        <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2DD4BF" />
            <stop offset="100%" stop-color="#0D9488" />
        </linearGradient>
        <linearGradient id="iconBoxDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F766E" />
            <stop offset="100%" stop-color="#042F2E" />
        </linearGradient>
        <linearGradient id="iconArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5EEAD4" />
            <stop offset="100%" stop-color="#0D9488" />
        </linearGradient>
        <linearGradient id="iconWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0A192F" />
            <stop offset="50%" stop-color="#0D9488" />
            <stop offset="100%" stop-color="#2DD4BF" />
        </linearGradient>
        <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Emblem Icon centered -->
    <g transform="translate(0, 10)">
        <!-- Back wing feathers -->
        <path d="M45,28 C30,12 18,18 20,4 C38,10 52,22 56,32 Z" fill="#0F766E" opacity="0.7" />
        <path d="M42,34 C25,20 12,24 14,12 C32,18 46,28 50,38 Z" fill="#14B8A6" opacity="0.85" />
        
        <!-- Parcel Cube (Isometric) -->
        <!-- Top Face -->
        <polygon points="56,36 82,23 108,36 82,49" fill="url(#iconBoxGrad)" stroke="#042F2E" stroke-width="2.5" stroke-linejoin="round" />
        <line x1="82" y1="23" x2="82" y2="49" stroke="#042F2E" stroke-width="2" opacity="0.5" />
        
        <!-- Left Face -->
        <polygon points="56,36 82,49 82,82 56,69" fill="url(#iconBoxDark)" stroke="#042F2E" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Right Face -->
        <polygon points="82,49 108,36 108,69 82,82" fill="url(#iconBoxGrad)" stroke="#042F2E" stroke-width="2.5" stroke-linejoin="round" />
        
        <!-- Front Main Wings (Curving forward-left) -->
        <path d="M60,48 C35,28 10,34 5,16 C30,22 55,38 62,56 Z" fill="url(#iconWingGrad)" stroke="#0A192F" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M56,58 C32,40 16,46 12,32 C34,36 52,50 58,66 Z" fill="url(#iconWingGrad)" stroke="#0A192F" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M50,68 C32,54 22,60 18,48 C36,50 48,60 52,74 Z" fill="url(#iconWingGrad)" stroke="#0A192F" stroke-width="2.5" stroke-linejoin="round" />

        <!-- Dynamic Swoosh / Speed Arrow underneath to top right -->
        <path d="M36,75 C45,86 70,88 92,72 L124,56 L116,44 L142,42 L132,68 L124,56 C98,76 60,86 36,75 Z" 
              fill="url(#iconArrowGrad)" stroke="#042F2E" stroke-width="2.5" stroke-linejoin="round" filter="url(#iconGlow)" />
    </g>
</svg>

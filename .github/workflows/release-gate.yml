name: Release gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: netpack_test
          MYSQL_USER: netpack
          MYSQL_PASSWORD: netpack_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unetpack -pnetpack_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, fileinfo, gd, iconv, mbstring, openssl, pdo_mysql, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          npm audit --omit=dev

      - name: Run automated tests
        env:
          APP_KEY: base64:7genAr6vdKRc37ptrhKOuTO5+aDkJIL96kUUGqV11F8=
        run: php artisan test

      - name: Verify PWA cache boundaries
        run: npm run test:pwa

      - name: Verify MySQL schema and seeders
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: netpack_test
          DB_USERNAME: netpack
          DB_PASSWORD: netpack_test_password
        run: |
          php artisan migrate:fresh --seed --force
          php artisan test

      - name: Build frontend assets
        run: npm run build

      - name: Verify production caches
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan optimize
          php artisan optimize:clear

      - name: Reject uncommitted generated changes
        run: git diff --exit-code
